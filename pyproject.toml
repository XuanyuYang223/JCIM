[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jcim-pilot"
version = "0.1.0"
description = "Controlled experiments on local molecular representation reuse"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy>=2,<3", "rdkit>=2025", "torch>=2.11,<2.12", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["jcim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
